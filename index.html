<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課堂登分｜先行智庫 KSCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#061F55; --navy-2:#0B3A8C; --blue:#1557B8; --sky:#4DA3FF; --gold:#FFC617;
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#16233D; --muted:#5B6A85; --line:#D8E1F0; --soft:#E8F0FC;
  --ok:#0E9F6E; --err:#D92D5C;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071228; --surface:#0E1E3D; --ink:#E6EDFA; --muted:#9AAACA; --line:#22365E; --soft:#132a52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg:#071228;--surface:#0E1E3D;--ink:#E6EDFA;--muted:#9AAACA;--line:#22365E;--soft:#132a52;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}

.top{background:radial-gradient(120% 160% at 10% 0%,var(--blue) 0%,var(--navy-2) 40%,var(--navy) 100%);color:#FFFFFF;padding:18px 20px 22px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:28px;width:auto;filter:brightness(0) invert(1)}
.top .tag{font-size:.8rem;letter-spacing:.08em;opacity:.85}
.course{max-width:560px;margin:14px auto 0;font-weight:900;font-size:1.3rem;line-height:1.35}

.demo{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:#FFF4C2;color:#5c4700;font-size:.85rem}
.card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 4px;font-size:1.1rem}
.card p.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.88rem;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.groups button{padding:12px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700}
.groups button[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.primary{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--navy-2),var(--blue));color:#FFFFFF;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--sky);padding:0;font-size:.85rem;text-decoration:underline}

.me{display:flex;align-items:center;justify-content:space-between;gap:12px}
.me .who{font-size:.95rem}
.me .who b{display:block;font-size:1.05rem}
.score{text-align:right}
.score .n{font-size:2.6rem;font-weight:900;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score .u{font-size:.8rem;color:var(--muted)}
.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}

.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.item .t{font-weight:700;line-height:1.45}
.item .p{display:inline-block;margin-top:4px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.82rem;font-weight:700}
.item .cnt{margin-left:6px;font-size:.8rem;color:var(--muted)}
.item .code{grid-column:1/-1}
.item .code input{padding:10px 12px;font-size:.95rem;text-transform:uppercase}
.item .go{padding:10px 18px;border:0;border-radius:999px;background:var(--blue);color:#FFFFFF;font-weight:700;white-space:nowrap}
.item .go:disabled{background:var(--line);color:var(--muted);cursor:default}
.item.done{background:var(--soft)}

.msg{margin-top:18px;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:.92rem;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--err);color:#FFFFFF}
.toast.ok{background:var(--ok);color:#FFFFFF}

/* ===== 講師排行榜 ===== */
body.board{background:radial-gradient(120% 120% at 0% 0%,var(--blue) 0%,var(--navy-2) 35%,var(--navy) 70%,#020B24 100%);color:#FFFFFF;min-height:100vh}
body.board::before{background:var(--navy)}
.bw{max-width:1280px;margin:0 auto;padding:28px clamp(16px,4vw,56px) 40px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bhead img{height:32px;filter:brightness(0) invert(1)}
.bhead .tools{display:flex;gap:10px;align-items:center;font-size:.85rem;opacity:.85}
.bhead .tools button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#FFFFFF;border-radius:999px;padding:6px 14px}
.btitle{margin:28px 0 6px;font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:900;line-height:1.3}
.bsub{margin:0 0 28px;opacity:.75}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.row{display:grid;grid-template-columns:64px minmax(110px,180px) 1fr 120px;align-items:center;gap:16px}
.row .pos{font-size:2rem;font-weight:900;text-align:center;opacity:.9;font-variant-numeric:tabular-nums}
.row .g{font-size:clamp(1.1rem,2.2vw,1.6rem);font-weight:700}
.row .g small{display:block;font-size:.8rem;font-weight:400;opacity:.7}
.bar{height:44px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#2F7BE0,var(--sky));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row.first .bar i{background:linear-gradient(90deg,#F5A300,var(--gold))}
.row.first .pos{color:var(--gold)}
.row .t{font-size:clamp(1.4rem,2.8vw,2.2rem);font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.pinbox{max-width:360px;margin:12vh auto 0;padding:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px}
.pinbox h2{margin:0 0 6px}
.pinbox p{margin:0 0 14px;opacity:.8;font-size:.9rem}
.pinbox input{background:rgba(255,255,255,.95);color:#16233D;border:0;font-size:1.2rem;letter-spacing:.3em;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.bump{animation:none}.toast{transition:none}}
@media (max-width:640px){
  .row{grid-template-columns:40px 1fr 70px;grid-template-areas:"pos g t" "bar bar bar";gap:6px 12px}
  .row .pos{grid-area:pos;font-size:1.4rem}.row .g{grid-area:g}.row .t{grid-area:t}.row .bar{grid-area:bar;height:16px}
}
</style>
</head>

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 2200);
}
function deviceId(){
  let d = LS.get('kscc-device');
  if(!d){ d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); LS.set('kscc-device', d); }
  return d;
}

async function api(action, data){
  if(DEMO) return mock(action, data || {});
  try{
    if(action === 'submit'){
      const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data) });
      return await r.json();
    }
    const q = { action };
    Object.keys(data).forEach(k => { q[k === 'c' ? 'course' : k === 'd' ? 'device' : k] = data[k]; });
    const r = await fetch(API_URL + '?' + new URLSearchParams(q));
    return await r.json();
  }catch(e){
    return { ok:false, error:'連線失敗，請確認網路後再試一次' };
  }
}

/* ============ 示範模式資料 ============ */
const MOCK = {
  title:'玉山證券｜流程盤點工作坊（示範）', active:true,
  groups:['第1組','第2組','第3組','第4組','第5組','第6組'],
  items:[
    {id:'s1',label:'完成步驟一：As-Is 現況盤點',points:10,once:true,needCode:false},
    {id:'s2',label:'完成步驟二：瓶頸診斷與 ECRS',points:10,once:true,needCode:false},
    {id:'s3',label:'完成步驟三：自動化積木模組',points:10,once:true,needCode:false},
    {id:'s4',label:'完成步驟四：To-Be 流程與改善行動',points:20,once:true,needCode:false},
    {id:'up',label:'上傳 To-Be 發表圖片',points:20,once:true,needCode:false},
    {id:'pre',label:'完成分組發表',points:30,once:true,needCode:true,code:'GO2026'},
    {id:'ask',label:'課堂提問或分享',points:5,once:false,needCode:false}
  ],
  scores:[], board:{'第1組':120,'第2組':95,'第3組':140,'第4組':60,'第5組':110,'第6組':85}
};
function mock(action, d){
  const mine = () => {
    const counts = {}; let total = 0;
    MOCK.scores.forEach(s => { counts[s.item] = (counts[s.item]||0) + 1; total += s.points; });
    return { ok:true, total, counts };
  };
  if(action === 'config') return { ok:true, title:MOCK.title, active:true, groups:MOCK.groups, items:MOCK.items.map(({code, ...i}) => i) };
  if(action === 'me') return mine();
  if(action === 'submit'){
    const it = MOCK.items.find(i => i.id === d.item);
    const m = mine();
    if(it.once && m.counts[it.id]) return { ok:false, error:'這個項目已經登過分了' };
    if(it.needCode && String(d.taskCode||'').toUpperCase() !== it.code) return { ok:false, error:'任務碼不正確（示範任務碼：GO2026）' };
    MOCK.scores.push({ item:it.id, points:it.points });
    MOCK.board[d.group] = (MOCK.board[d.group]||0) + it.points;
    return { ...mine(), added:it.points };
  }
  if(action === 'board'){
    Object.keys(MOCK.board).forEach(g => { if(Math.random() < .35) MOCK.board[g] += [5,10,20][Math.floor(Math.random()*3)]; });
    return { ok:true, title:MOCK.title, updated:new Date().toISOString(),
      groups: Object.entries(MOCK.board).map(([name,total]) => ({ name, total, people: 4 + (name.charCodeAt(1)%3) })).sort((a,b) => b.total - a.total) };
  }
}

/* ============ 學員端 ============ */
let CFG = null, ME = null;
const KEY = () => 'kscc-me-' + COURSE;

function shell(inner){
  app.innerHTML = `
    <header class="top"><div class="top-in"><img src="${LOGO}" alt="先行智庫 KSCC"><span class="tag">課堂登分</span></div>
      ${CFG ? `<div class="course">${esc(CFG.title)}</div>` : ''}</header>
    <main class="wrap">${DEMO ? '<p class="demo">示範模式：尚未連接試算表，分數不會被儲存。</p>' : ''}${inner}</main>`;
}

async function student(){
  if(!COURSE){ shell('<div class="msg">網址缺少課程代碼。請重新掃描講師提供的 QR Code。</div>'); return; }
  shell('<div class="msg">載入中…</div>');
  const cfg = await api('config', { c:COURSE });
  if(!cfg.ok){ shell(`<div class="msg">${esc(cfg.error)}</div>`); return; }
  CFG = cfg;
  const profile = LS.get(KEY());
  if(!profile) return join();
  ME = profile;
  home();
}

function join(prev){
  let group = prev && prev.group || '';
  shell(`
    <section class="card">
      <h2>加入這堂課</h2>
      <p class="sub">填寫一次就好，之後打開會自動記得。</p>
      <label for="nm">姓名</label>
      <input id="nm" maxlength="20" autocomplete="name" value="${esc(prev && prev.name || '')}" placeholder="例如：王小明">
      <label>組別</label>
      <div class="groups" role="group" aria-label="選擇組別">
        ${CFG.groups.map(g => `<button type="button" data-g="${esc(g)}" aria-pressed="${g === group}">${esc(g)}</button>`).join('')}
      </div>
      <button class="primary" id="start" disabled>開始登分</button>
    </section>`);
  const nm = document.getElementById('nm'), start = document.getElementById('start');
  const check = () => start.disabled = !(nm.value.trim() && group);
  document.querySelectorAll('.groups button').forEach(b => b.addEventListener('click', () => {
    group = b.dataset.g;
    document.querySelectorAll('.groups button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    check();
  }));
  nm.addEventListener('input', check); check();
  start.addEventListener('click', () => {
    ME = { name:nm.value.trim(), group };
    LS.set(KEY(), ME); home();
  });
}

async function home(){
  shell(`
    <section class="card me">
      <div class="who">${esc(ME.group)}<b>${esc(ME.name)}</b><button class="link" id="edit" type="button">修改姓名或組別</button></div>
      <div class="score"><div class="n" id="total">–</div><div class="u">我的積分</div></div>
    </section>
    <section class="card">
      <h2>登分項目</h2>
      <p class="sub">完成任務後按「登分」。需要任務碼的項目，請輸入講師公布的代碼。</p>
      <ul class="items" id="items"></ul>
    </section>`);
  document.getElementById('edit').addEventListener('click', () => join(ME));
  const r = await api('me', { c:COURSE, d:deviceId() });
  renderItems(r.ok ? r : { total:0, counts:{} });
  if(!r.ok) toast(r.error, 'err');
}

function renderItems(state){
  document.getElementById('total').textContent = state.total;
  const ul = document.getElementById('items');
  ul.innerHTML = CFG.items.map(it => {
    const n = state.counts[it.id] || 0;
    const done = it.once && n > 0;
    return `<li class="item${done ? ' done' : ''}">
      <div><div class="t">${esc(it.label)}</div><span class="p">+${it.points}</span>${!it.once && n ? `<span class="cnt">已登 ${n} 次</span>` : ''}</div>
      <button class="go" type="button" data-id="${esc(it.id)}" ${done || !CFG.active ? 'disabled' : ''}>${done ? '已完成' : (!it.once && n ? '再登一次' : '登分')}</button>
      ${it.needCode && !done ? `<div class="code"><input data-code="${esc(it.id)}" placeholder="輸入任務碼" aria-label="${esc(it.label)}的任務碼" autocomplete="off"></div>` : ''}
    </li>`;
  }).join('');
  ul.querySelectorAll('.go:not(:disabled)').forEach(b => b.addEventListener('click', () => send(b)));
}

async function send(btn){
  const id = btn.dataset.id;
  const codeEl = document.querySelector(`[data-code="${CSS.escape(id)}"]`);
  const it = CFG.items.find(i => i.id === id);
  if(it.needCode && !(codeEl && codeEl.value.trim())){ toast('請先輸入任務碼', 'err'); codeEl && codeEl.focus(); return; }
  btn.disabled = true; btn.textContent = '登分中…';
  const r = await api('submit', { c:COURSE, d:deviceId(), name:ME.name, group:ME.group, item:id, taskCode: codeEl ? codeEl.value.trim() : '' });
  if(!r.ok){ toast(r.error, 'err'); btn.disabled = false; btn.textContent = '登分'; return; }
  renderItems(r);
  const t = document.getElementById('total'); t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
  toast(`+${r.added} 分，目前 ${r.total} 分`, 'ok');
}

/* ============ 講師排行榜 ============ */
let timer = null;
function boardShell(inner){
  document.body.classList.add('board');
  app.innerHTML = `<div class="bw">
    <div class="bhead"><img src="${LOGO}" alt="先行智庫 KSCC"><div class="tools" id="tools"></div></div>
    ${inner}</div>`;
}
function board(){
  if(!COURSE){ boardShell('<div class="pinbox"><h2>缺少課程代碼</h2><p>網址要加上 ?c=課程代碼&amp;board</p></div>'); return; }
  const saved = sessionStorage.getItem('kscc-pin-' + COURSE);
  if(saved || DEMO) return startBoard(saved || 'demo');
  boardShell(`<form class="pinbox" id="pf">
      <h2>講師排行榜</h2><p>輸入這堂課的講師密碼</p>
      <input id="pin" inputmode="numeric" autocomplete="off" aria-label="講師密碼">
      <button class="primary" type="submit">進入</button></form>`);
  document.getElementById('pin').focus();
  document.getElementById('pf').addEventListener('submit', e => { e.preventDefault(); startBoard(document.getElementById('pin').value.trim()); });
}
async function startBoard(pin){
  const r = await api('board', { c:COURSE, pin });
  if(!r.ok){ sessionStorage.removeItem('kscc-pin-' + COURSE); toast(r.error, 'err'); if(!document.getElementById('pf')) board(); return; }
  try{ sessionStorage.setItem('kscc-pin-' + COURSE, pin); }catch(e){}
  boardShell(`
    <h1 class="btitle">${esc(r.title)}</h1>
    <p class="bsub" id="bsub"></p>
    <ol class="rank" id="rank"></ol>`);
  document.getElementById('tools').innerHTML = `<span id="upd"></span><button type="button" id="fs">全螢幕</button>`;
  document.getElementById('fs').addEventListener('click', () => {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  drawBoard(r);
  clearInterval(timer);
  timer = setInterval(async () => {
    const n = await api('board', { c:COURSE, pin });
    if(n.ok) drawBoard(n);
  }, 5000);
}
function drawBoard(r){
  const max = Math.max(1, ...r.groups.map(g => g.total));
  const people = r.groups.reduce((s,g) => s + g.people, 0);
  document.getElementById('bsub').textContent = `各組積分排行，共 ${people} 位學員參與${DEMO ? '（示範資料）' : ''}`;
  const upd = document.getElementById('upd');
  if(upd) upd.textContent = '更新於 ' + new Date(r.updated).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const ol = document.getElementById('rank');
  const first = !ol.children.length;
  ol.innerHTML = r.groups.map((g,i) => `
    <li class="row${i === 0 && g.total > 0 ? ' first' : ''}">
      <span class="pos">${i + 1}</span>
      <span class="g">${esc(g.name)}<small>${g.people} 人</small></span>
      <span class="bar"><i style="width:${first ? 0 : g.total / max * 100}%" data-w="${g.total / max * 100}"></i></span>
      <span class="t">${g.total}</span>
    </li>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => ol.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%')));
}

IS_BOARD ? board() : student();
</script>
